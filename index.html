<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>かんたん動画編集（ブラウザ完結）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="appbar-left">
          <h1>かんたん動画編集</h1>
          <span class="appbar-note">端末内だけで処理します</span>
        </div>
        <button id="btn-save" class="btn btn-save" disabled>保存</button>
      </header>

      <div id="support-banner" class="banner" hidden></div>

      <ol id="steps" class="steps">
        <li data-step="1"><span class="steps-num">1</span>動画を選ぶ</li>
        <li data-step="2"><span class="steps-num">2</span>編集する</li>
        <li data-step="3"><span class="steps-num">3</span>保存する</li>
      </ol>

      <section class="preview-area">
        <div class="preview-box">
          <canvas id="preview-canvas"></canvas>
          <div id="preview-placeholder" class="placeholder">
            <p>まずは動画を選んでください</p>
            <button id="pick-video-big" class="btn btn-primary btn-big">動画を選ぶ</button>
          </div>
        </div>
        <div class="transport">
          <button id="btn-playpause" class="btn btn-round" disabled aria-label="再生/一時停止">▶</button>
          <span id="time-label" class="time-label">0:00.0 / 0:00.0</span>
        </div>
        <input
          id="seekbar"
          class="seekbar"
          type="range"
          min="0"
          max="1000"
          value="0"
          step="1"
          disabled
          aria-label="シークバー"
        />
      </section>

      <section id="timeline-area" class="timeline-area"></section>

      <nav class="toolbar" id="toolbar"></nav>

      <section id="panel" class="panel"></section>

      <footer class="foot">
        <p>
          フリーBGMは各サイトの利用規約を確認して使ってください。本アプリには音源を同梱していません。
        </p>
      </footer>
    </div>

    <!-- 保存シート（画面全体をおおう） -->
    <div id="save-sheet" class="sheet" hidden>
      <div class="sheet-inner">
        <header class="sheet-head">
          <h2 id="sheet-title">動画を保存する</h2>
          <button id="sheet-close" class="btn btn-round" aria-label="閉じる">✕</button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </div>
    </div>

    <input id="file-video" type="file" accept="video/*" multiple hidden />
    <input id="file-audio" type="file" accept="audio/*,.mp3,.m4a,.wav" hidden />
    <!-- iOS Safari は display:none の video からフレームを取り出せないことがあるため、画面外に置く -->
    <div id="video-host" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
